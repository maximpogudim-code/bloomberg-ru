<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloomberg RU — Перенаправление...</title>
<meta http-equiv="refresh" content="2;url=https://nissan-low-availability-asian.trycloudflare.com">
<style>
  body { font-family: Arial, sans-serif; background: #1a1a2e; color: #fff; 
         display: flex; align-items: center; justify-content: center; 
         min-height: 100vh; margin: 0; text-align: center; }
  .box { background: #16213e; padding: 40px; border-radius: 12px; max-width: 500px; }
  h1 { color: #e6a817; margin-bottom: 10px; }
  p { color: #aaa; margin: 10px 0; }
  .url { color: #4fc3f7; font-size: 13px; word-break: break-all; }
  .spinner { width: 40px; height: 40px; border: 4px solid #333; 
             border-top: 4px solid #e6a817; border-radius: 50%; 
             animation: spin 1s linear infinite; margin: 20px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  a { color: #4fc3f7; }
</style>
</head>
<body>
<div class="box">
  <h1>📺 Bloomberg RU</h1>
  <div class="spinner"></div>
  <p>Переход на Bloomberg с русским переводом...</p>
  <p class="url"><a href="https://nissan-low-availability-asian.trycloudflare.com</a></p>
  <script>
    fetch('url.txt?t=' + Date.now())
      .then(r => r.text())
      .then(url => { url = url.trim(); if(url) window.location.href = url; })
      .catch(() => window.location.href = 'https://nissan-low-availability-asian.trycloudflare.com');
  </script>
</div>
</body>
</html>
