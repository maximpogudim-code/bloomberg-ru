# HTTP → HTTPS redirect
server {
    listen 80;
    server_name _;

    # Let's Encrypt ACME challenge (for certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — main proxy
server {
    listen 443 ssl http2;
    server_name bloomberg-ru.duckdns.org;  # CHANGE TO YOUR DOMAIN

    ssl_certificate     /etc/letsencrypt/live/bloomberg-ru.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bloomberg-ru.duckdns.org/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Long timeout: Playwright + Claude takes up to 30 sec on first load
    proxy_read_timeout      90s;
    proxy_connect_timeout   10s;
    proxy_send_timeout      90s;

    # Buffering off — better for streaming long HTML
    proxy_buffering         off;

    location / {
        proxy_pass          http://app:8080;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }
}
